[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx-ingest"
version = "0.1.0"
description = "Durable SourceAsset registration and provenance-preserving document ingestion for Cognityx."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cognityx" }]
dependencies = [
  "cognityx-resource",
  "cognityx-storage",
  "cognityx-jobs",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9.5", "mkdocstrings-python>=1.12"]
inference = ["cognityx-inference"]

[project.scripts]
cognityx-ingest = "cognityx_ingest.cli:main"

[tool.uv.sources]
cognityx-resource = { git = "https://github.com/cognityx/cognityx-resource.git", rev = "79f89a965f46300be6a892d4371d44e6c288fd0c" }
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git", rev = "0d159136ebac6ce5362a5092ea4d6d2f181e9c89" }
cognityx-jobs = { git = "https://github.com/cognityx/cognityx-jobs.git", rev = "bfd10769703dfca97e6a70b0d242c5ccd961d702" }
cognityx-inference = { git = "https://github.com/cognityx/llm-benchmark.git" }

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@0d159136ebac6ce5362a5092ea4d6d2f181e9c89",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@bfd10769703dfca97e6a70b0d242c5ccd961d702",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

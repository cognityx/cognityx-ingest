[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx-ingest"
version = "0.1.0"
description = "Durable SourceAsset registration and provenance-preserving document ingestion for Cognityx."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Cognityx" }]
dependencies = [
  "cognityx-resource",
  "cognityx-storage",
  "cognityx-jobs",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mkdocs-material>=9.5", "mkdocstrings-python>=1.12"]
inference = ["cognityx-inference"]

[project.scripts]
cognityx-ingest = "cognityx_ingest.cli:main"

[tool.uv.sources]
cognityx-resource = { git = "https://github.com/cognityx/cognityx-resource.git", rev = "79f89a965f46300be6a892d4371d44e6c288fd0c" }
cognityx-storage = { git = "https://github.com/cognityx/cognityx-storage.git", rev = "c607756c3e9e2c3a858ff6d45bf0d0ea649964f6" }
cognityx-jobs = { git = "https://github.com/cognityx/cognityx-jobs.git", rev = "c081678b6184b2212e28fea7f23ecfd21031f090" }
cognityx-inference = { git = "https://github.com/cognityx/cognityx-inference.git" }

[tool.uv]
override-dependencies = [
  "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@79f89a965f46300be6a892d4371d44e6c288fd0c",
  "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@c607756c3e9e2c3a858ff6d45bf0d0ea649964f6",
  "cognityx-jobs @ git+https://github.com/cognityx/cognityx-jobs.git@c081678b6184b2212e28fea7f23ecfd21031f090",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
